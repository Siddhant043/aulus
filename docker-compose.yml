services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aulus
      POSTGRES_PASSWORD: aulus
      POSTGRES_DB: aulus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulus -d aulus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-stack:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://aulus:aulus@postgres:5432/aulus
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://aulus:aulus@postgres:5432/aulus
      REDIS_URL: redis://redis-stack:6379
      APP_PORT: "3000"
      NODE_ENV: production
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-stack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://aulus:aulus@postgres:5432/aulus
      REDIS_URL: redis://redis-stack:6379
      NODE_ENV: production
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-stack:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
